[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forged-fingerprints"
version = "0.1.0"
description = "Can a fine-tune break safety while keeping its refusal fingerprint? Adaptive attack on refusal-vector safety attestation, a hardened check, and repair. Lexsi AI Safety Hackathon, Track 2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.45",
    "datasets>=2.20",
    "huggingface_hub>=0.24",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The four Lexsi Track 2 libraries. SafeTune needs Python >= 3.12.
lexsi = [
    "safetune",
    "circuitkit",
    "auditkit[transformers]",
    "curatorkit[all]",
]
train = ["peft>=0.11", "accelerate>=0.33"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
